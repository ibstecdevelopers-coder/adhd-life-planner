:root,[data-theme=blush]{
 --bg1:#FFF6F9;--bg2:#FBEFF8;--blobA:#FFD3E3;--blobB:#E9D9FF;--blobC:#FFE6D6;
 --glass:rgba(255,255,255,.72);--glass2:rgba(255,255,255,.55);--line:#F2DCE7;--line2:#EBCFDD;
 --ink:#3B2433;--sub:#8E6E81;--mute:#B89AAB;
 --pri:#D6538A;--pri2:#E98AB0;--priSoft:#FCE3EE;--lav:#9A6FD3;--lavSoft:#EFE4FD;
 --mint:#3F9A72;--mintSoft:#DDF3E8;--peach:#E07F4F;--peachSoft:#FFE9DC;--sky:#4E86C9;--skySoft:#E1EDFB;--gold:#C99A2E;--goldSoft:#FBF0D3;
 --side:rgba(255,255,255,.62);--shadow:0 10px 30px rgba(170,90,130,.12),0 2px 6px rgba(170,90,130,.06);--ring:rgba(214,83,138,.25);
 color-scheme:light}
[data-theme=lavender]{--bg1:#F8F5FF;--bg2:#F1EBFE;--blobA:#E3D5FF;--blobB:#FFD8EA;--blobC:#D9E8FF;--line:#E4DAF6;--line2:#D9CCF0;
 --ink:#2F2442;--sub:#7A6A92;--mute:#A898BF;--pri:#8F5FD0;--pri2:#B793E6;--priSoft:#EFE6FD;--lav:#D6538A;--lavSoft:#FCE3EE;--shadow:0 10px 30px rgba(120,90,180,.13),0 2px 6px rgba(120,90,180,.06);--ring:rgba(143,95,208,.25)}
[data-theme=moonlight]{--bg1:#1B141F;--bg2:#241A2A;--blobA:#5A2747;--blobB:#3A2A5C;--blobC:#4A2B33;
 --glass:rgba(48,34,54,.72);--glass2:rgba(60,43,66,.55);--line:#46334D;--line2:#56405E;
 --ink:#F7EAF2;--sub:#C7AABD;--mute:#8E7488;--pri:#F28DB5;--pri2:#F6A9C8;--priSoft:#4A2A3E;--lav:#C3A1F2;--lavSoft:#3A2D52;
 --mint:#7FD3AA;--mintSoft:#24382F;--peach:#F4A37C;--peachSoft:#43302A;--sky:#8DB8EE;--skySoft:#25324A;--gold:#E9C56A;--goldSoft:#3E3522;
 --side:rgba(36,26,42,.78);--shadow:0 10px 30px rgba(0,0,0,.35);--ring:rgba(242,141,181,.3);color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Jakarta,system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:
 radial-gradient(600px 420px at 8% 4%,var(--blobA),transparent 70%),
 radial-gradient(520px 420px at 95% 12%,var(--blobB),transparent 70%),
 radial-gradient(600px 500px at 70% 100%,var(--blobC),transparent 70%);opacity:.75}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:256px;flex:none;position:sticky;top:0;height:100vh;overflow:auto;padding:18px 14px;background:var(--side);backdrop-filter:blur(18px);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:10px;z-index:40}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 8px}
.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--pri2),var(--pri) 55%,var(--lav));display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px var(--ring)}
.brand b{font:600 16px Playfair;letter-spacing:.2px;display:block}
.brand small{font-size:10.5px;color:var(--sub);letter-spacing:1.4px;text-transform:uppercase}
.focuscard{background:linear-gradient(135deg,var(--priSoft),var(--lavSoft));border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.focuscard .k{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--sub);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.focuscard .v{font-size:12.5px;margin-top:3px}
.navlbl{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--mute);font-weight:700;margin:8px 8px 2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:6.5px 10px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:500;font-size:13.5px;transition:.15s}
.nav a svg{width:17px;height:17px;color:var(--sub);flex:none}
.nav a:hover{background:var(--glass2)}
.nav a.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 6px 14px var(--ring)}
.nav a.on svg{color:#fff}
.nav .cnt{margin-left:auto;font-size:10.5px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--sub);font-weight:600}
.nav a.on .cnt{background:rgba(255,255,255,.25);border-color:transparent;color:#fff}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.me{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;background:var(--glass);border:1px solid var(--line)}
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--pri2),var(--lav));display:grid;place-items:center;color:#fff;font-weight:700}
.me b{font-size:12.5px;display:block}.me small{font-size:10.5px;color:var(--sub)}
/* main */
.main{flex:1;min-width:0;padding:18px 28px 60px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;position:sticky;top:0;z-index:30;padding:10px 0;backdrop-filter:blur(10px)}
.top h1{font:600 22px Playfair;margin:0}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--priSoft);color:var(--pri);border:1px solid var(--line)}
.chip.lav{background:var(--lavSoft);color:var(--lav)}.chip.mint{background:var(--mintSoft);color:var(--mint)}.chip.peach{background:var(--peachSoft);color:var(--peach)}.chip.sky{background:var(--skySoft);color:var(--sky)}.chip.gold{background:var(--goldSoft);color:var(--gold)}.chip.grey{background:var(--glass2);color:var(--sub)}
.top .sp{flex:1}
.icon-btn.ham{display:none}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--glass);padding:8px 14px;border-radius:12px;cursor:pointer;font-weight:600;font-size:13px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--pri2);transform:translateY(-1px)}
.btn svg{width:16px;height:16px}
.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));border-color:transparent;color:#fff;box-shadow:0 6px 16px var(--ring)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:10px}
.btn.ghost{background:transparent}
.btn.danger{color:#C2416B}
.icon-btn{width:30px;height:30px;display:inline-grid;place-items:center;border-radius:9px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--sub)}
.icon-btn:hover{background:var(--glass2);border-color:var(--line);color:var(--pri)}
.icon-btn svg{width:15px;height:15px}
/* cards */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card.tint{background:linear-gradient(135deg,var(--priSoft),var(--glass) 60%)}
.card.lav{background:linear-gradient(135deg,var(--lavSoft),var(--glass) 70%)}
.card.mint{background:linear-gradient(135deg,var(--mintSoft),var(--glass) 70%)}
.card.peach{background:linear-gradient(135deg,var(--peachSoft),var(--glass) 70%)}
.card.sky{background:linear-gradient(135deg,var(--skySoft),var(--glass) 70%)}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.ch h3{margin:0;font-size:14px;font-weight:700}
.ch .sub{color:var(--sub);font-size:12px}
.ch .sp{flex:1}
.eyebrow{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--pri);font-weight:700;display:flex;align-items:center;gap:6px}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:26px 28px;background:linear-gradient(120deg,var(--priSoft),var(--lavSoft) 60%,var(--peachSoft));border:1px solid var(--line);box-shadow:var(--shadow)}
.hero h2{font:600 30px Playfair;margin:6px 0 4px}
.hero h2 .script{font:400 46px Allura;color:var(--pri);font-weight:400;line-height:.8}
.hero p{margin:0;color:var(--sub)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .n{font:600 30px Playfair;line-height:1.1}
.stat .l{font-size:12px;color:var(--sub)}
.stat .k{font-size:11px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:6px}
.bar{height:8px;border-radius:99px;background:var(--glass2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pri),var(--pri2))}
.bar.mint i{background:linear-gradient(90deg,var(--mint),#8BD3B0)}.bar.lav i{background:linear-gradient(90deg,var(--lav),#C7AEF0)}.bar.peach i{background:linear-gradient(90deg,var(--peach),#F6B892)}.bar.sky i{background:linear-gradient(90deg,var(--sky),#9CC2EE)}
.muted{color:var(--sub)}.small{font-size:12px}.tiny{font-size:11px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.empty{text-align:center;color:var(--sub);padding:22px 10px;font-size:13px}
.empty .e{font-size:28px}
/* list items */
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--glass2);border:1px solid var(--line);transition:.15s}
.item:hover{border-color:var(--pri2)}
.item .t{flex:1;min-width:0}
.item .t b{font-weight:600;font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis}
.item .t small{color:var(--sub);font-size:11.5px}
.item.done .t b{text-decoration:line-through;color:var(--mute)}
.item .acts{display:flex;gap:2px;opacity:.55}.item:hover .acts{opacity:1}
.ck{width:22px;height:22px;border-radius:8px;border:2px solid var(--line2);background:var(--glass);display:grid;place-items:center;cursor:pointer;flex:none;transition:.15s;padding:0}
.ck.round{border-radius:50%}
.ck svg{width:13px;height:13px;color:#fff;opacity:0}
.ck.on{background:linear-gradient(135deg,var(--mint),#6CC79C);border-color:transparent}
.ck.on svg{opacity:1}
.list{display:flex;flex-direction:column;gap:7px}
.seg{display:inline-flex;background:var(--glass2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:9px;cursor:pointer;font-size:12px;font-weight:600;color:var(--sub)}
